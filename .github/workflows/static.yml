name: Pages Upload 
on:
  push:
    branches:
     - "*"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  deploy:
    if: github.repository_owner == 'myridia'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 
        run : | 
          git clone https://github.com/myridia/lanzarote-vulkane.de.git 
          cd lanzarote-vulkane.de 
              
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './lanzarote-vulkane.de/pages/wordpress'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
